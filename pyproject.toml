[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-db-rag"
version = "0.2.0"
description = "Research paper retrieval and GraphRAG over time-series forecasting articles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.20,<7",
    "openai>=1,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
    "qdrant-client>=1.10,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
vector-db-rag = "vector_db_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
